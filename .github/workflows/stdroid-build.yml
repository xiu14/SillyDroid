name: stdroid-build

# 自用 fork 专用：SillyDroid 的构建和发布都在这里跑，不走 rbuild。
# 本机入口：bash scripts/stdroid-gha-build.sh（见 AI_HANDOFF.md「常用构建和验证命令」「发布新版本」）。
# 脚本把工作区快照成临时 commit 强推到 ci/stdroid 触发本 workflow（push 触发不要求 workflow 在默认分支上），
# 参数写在 commit message 的 trailer 里：
#   Stdroid-CI-Mode: full | gradle | publish | keepalive
#   Stdroid-CI-Args: full / publish 模式是 build-stdroid-full.sh 的额外参数；gradle 模式是 Gradle 任务
#   Stdroid-CI-Changelog-B64: publish 模式的更新说明（base64）
# full：scripts/build-stdroid-full.sh --build-type debug，产物 artifact stdroid-apk-debug，保留 3 天。
# gradle：./gradlew -p android-tavern <任务>，测试报告 artifact stdroid-gradle-reports，保留 3 天。
# publish：同 full，再建 Release stdroid-v<versionName>，挂上 APK 和 version.json 并设为 latest；
#   App 从 releases/latest/download/version.json 检查更新（android-tavern/app/build.gradle.kts）。
# keepalive：只把 full / gradle 两份缓存各拉一次，刷新「最后使用时间」，不编译、不存缓存；
#   GitHub 会删掉 7 天没用过的缓存，没缓存的完整构建要 11 分钟多，有缓存约 2.5 分钟。
#   由 VPS 的 cron 每天跑 scripts/stdroid-gha-keepalive.sh，缓存 4 天没用才推一次。
# 版本号取 android-tavern/gradle.properties 的 stdroidVersionCode / stdroidVersionName，不按上游规则改写。

on:
  push:
    branches:
      - ci/stdroid

# keepalive 单独一组：既不会取消正在跑的构建，也不会被之后推的构建取消。
concurrency:
  group: stdroid-build-${{ contains(github.event.head_commit.message, 'Stdroid-CI-Mode: keepalive') && 'keepalive' || 'build' }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # assets 里的 server-source-manifest.json 不入库，CI 上读不到当前版本；
  # 固定与本机 assets 一致，避免无意中升级 SillyTavern。升级 Tavern 时同步改这里。
  STDROID_TAVERN_TAG: '1.18.0'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Plan
        id: plan
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          trailer() {
            printf '%s\n' "$COMMIT_MESSAGE" | sed -n "s/^$1:[[:space:]]*//p" | tail -n 1 | tr -d '\r'
          }
          mode="$(trailer Stdroid-CI-Mode)"
          args="$(trailer Stdroid-CI-Args)"
          changelog_b64="$(trailer Stdroid-CI-Changelog-B64)"
          mode="${mode:-full}"
          case "$mode" in
            full|publish) full='true' ;;
            gradle|keepalive) full='false' ;;
            *) echo "未知 Stdroid-CI-Mode：$mode" >&2; exit 1 ;;
          esac
          if [[ "$mode" == 'gradle' && -z "$args" ]]; then
            echo 'gradle 模式需要在 Stdroid-CI-Args 里写 Gradle 任务' >&2
            exit 1
          fi
          if [[ "$mode" == 'publish' ]]; then
            changelog="$(printf '%s' "$changelog_b64" | base64 --decode)"
            if [[ -z "${changelog//[[:space:]]/}" ]]; then
              echo 'publish 模式需要更新说明（Stdroid-CI-Changelog-B64）' >&2
              exit 1
            fi
          fi
          {
            printf 'mode=%s\n' "$mode"
            printf 'full=%s\n' "$full"
            printf 'args=%s\n' "$args"
            printf 'changelog_b64=%s\n' "$changelog_b64"
          } >> "$GITHUB_OUTPUT"
          printf 'mode=%s\nargs=%s\n' "$mode" "$args"

      # 构建前先检查版本号和 tag，免得白编一趟。
      - name: Check release version
        id: version
        if: steps.plan.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          read_property() {
            sed -n "s/^$1=//p" android-tavern/gradle.properties | head -n 1 | tr -d '\r[:space:]'
          }
          code="$(read_property stdroidVersionCode)"
          name="$(read_property stdroidVersionName)"
          [[ "$code" =~ ^[0-9]+$ && -n "$name" ]] || { echo "gradle.properties 版本号无效：code=$code name=$name" >&2; exit 1; }
          tag="stdroid-v$name"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $tag 已存在，先改 stdroidVersionName / stdroidVersionCode" >&2
            exit 1
          fi
          latest_url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/version.json"
          status="$(curl -sL -o "$RUNNER_TEMP/latest-version.json" -w '%{http_code}' "$latest_url")"
          if [[ "$status" == '200' ]]; then
            current="$(python3 -c 'import json,sys; print(int(json.load(open(sys.argv[1])).get("versionCode", 0)))' "$RUNNER_TEMP/latest-version.json")"
          elif [[ "$status" == '404' ]]; then
            current=0
          else
            echo "读取线上 version.json 失败：HTTP $status" >&2
            exit 1
          fi
          if (( code <= current )); then
            echo "stdroidVersionCode=$code 不大于线上 versionCode=$current，App 不会提示更新" >&2
            exit 1
          fi
          printf 'code=%s\nname=%s\ntag=%s\n' "$code" "$name" "$tag" >> "$GITHUB_OUTPUT"
          printf '发布 %s（versionCode %s，线上 %s）\n' "$tag" "$code" "$current"

      # ubuntu-latest 默认 JDK 25，项目的 Mockito / Robolectric（Byte Buddy）只支持到 Java 22，单测会大面积失败。
      # 固定 JDK 17，与 rbuild 构建机一致。
      - name: Set up JDK 17
        if: steps.plan.outputs.mode != 'keepalive'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 两种模式分开存缓存：gradle 模式的缓存里没有 rootfs / server，不能占用 full 的 key。
      - name: Restore build caches (full)
        if: steps.plan.outputs.full == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/sillydroid-android-toolchain
            ~/.cache/sillydroid-android-rootfs
            ~/.gradle/caches
            ~/.gradle/wrapper
            artifacts/releases/rootfs
            artifacts/releases/server-source
          key: stdroid-build-${{ runner.os }}-${{ env.STDROID_TAVERN_TAG }}-${{ hashFiles('scripts/*.sh', '!scripts/stdroid-gha-build.sh', '!scripts/stdroid-gha-keepalive.sh', 'sillydroid-build-config.json', 'android-tavern/build.gradle.kts', 'android-tavern/settings.gradle.kts', 'android-tavern/gradle.properties', 'android-tavern/app/build.gradle.kts', 'gradle/wrapper/*', 'gradlew') }}
          restore-keys: |
            stdroid-build-${{ runner.os }}-${{ env.STDROID_TAVERN_TAG }}-
            stdroid-build-${{ runner.os }}-

      - name: Restore build caches (gradle)
        if: steps.plan.outputs.mode == 'gradle'
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: stdroid-gradle-${{ runner.os }}-${{ hashFiles('android-tavern/**/*.gradle.kts', 'android-tavern/gradle.properties', 'android-tavern/gradle/libs.versions.toml', 'gradle/wrapper/*', 'gradlew') }}
          restore-keys: |
            stdroid-gradle-${{ runner.os }}-

      # keepalive：key 和 restore-keys 必须与上面两步保持一致；用 cache/restore，不命中也不会存一份空缓存。
      - name: Keep cache warm (full)
        id: keep_full
        if: steps.plan.outputs.mode == 'keepalive'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/sillydroid-android-toolchain
            ~/.cache/sillydroid-android-rootfs
            ~/.gradle/caches
            ~/.gradle/wrapper
            artifacts/releases/rootfs
            artifacts/releases/server-source
          key: stdroid-build-${{ runner.os }}-${{ env.STDROID_TAVERN_TAG }}-${{ hashFiles('scripts/*.sh', '!scripts/stdroid-gha-build.sh', '!scripts/stdroid-gha-keepalive.sh', 'sillydroid-build-config.json', 'android-tavern/build.gradle.kts', 'android-tavern/settings.gradle.kts', 'android-tavern/gradle.properties', 'android-tavern/app/build.gradle.kts', 'gradle/wrapper/*', 'gradlew') }}
          restore-keys: |
            stdroid-build-${{ runner.os }}-${{ env.STDROID_TAVERN_TAG }}-
            stdroid-build-${{ runner.os }}-

      - name: Keep cache warm (gradle)
        id: keep_gradle
        if: steps.plan.outputs.mode == 'keepalive'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: stdroid-gradle-${{ runner.os }}-${{ hashFiles('android-tavern/**/*.gradle.kts', 'android-tavern/gradle.properties', 'android-tavern/gradle/libs.versions.toml', 'gradle/wrapper/*', 'gradlew') }}
          restore-keys: |
            stdroid-gradle-${{ runner.os }}-

      - name: Keepalive summary
        if: steps.plan.outputs.mode == 'keepalive'
        env:
          FULL_KEY: ${{ steps.keep_full.outputs.cache-matched-key }}
          GRADLE_KEY: ${{ steps.keep_gradle.outputs.cache-matched-key }}
        run: |
          printf 'full:   %s\ngradle: %s\n' "${FULL_KEY:-（没有可用缓存）}" "${GRADLE_KEY:-（没有可用缓存）}" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install system packages
        if: steps.plan.outputs.full == 'true'
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y unzip zip binutils xz-utils libatomic1

      - name: Build (full)
        if: steps.plan.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          CI_ARGS: ${{ steps.plan.outputs.args }}
        run: |
          read -ra extra <<< "$CI_ARGS"
          tag_args=(--tavern-tag "$STDROID_TAVERN_TAG")
          for arg in "${extra[@]}"; do
            [[ "$arg" == '--tavern-tag' ]] && tag_args=()
          done
          bash ./scripts/build-stdroid-full.sh --build-type debug "${tag_args[@]}" "${extra[@]}"

      - name: Build (gradle)
        if: steps.plan.outputs.mode == 'gradle'
        env:
          CI_ARGS: ${{ steps.plan.outputs.args }}
        run: |
          read -ra tasks <<< "$CI_ARGS"
          bash ./gradlew --no-daemon --console=plain -p android-tavern "${tasks[@]}"

      - name: Upload APK
        if: steps.plan.outputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: stdroid-apk-debug
          path: artifacts/releases/android-apk/
          retention-days: 3
          compression-level: 0
          if-no-files-found: error

      - name: Upload Gradle reports
        if: always() && steps.plan.outputs.mode == 'gradle'
        uses: actions/upload-artifact@v4
        with:
          name: stdroid-gradle-reports
          path: android-tavern/**/build/reports/
          retention-days: 3
          if-no-files-found: ignore

      # 先建草稿、传完 APK 和 version.json 再正式发布，latest/download/version.json 不会指向还没传完的 APK。
      - name: Publish release
        if: steps.plan.outputs.mode == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG_B64: ${{ steps.plan.outputs.changelog_b64 }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out"
          asset="$RELEASE_TAG.apk"
          cp artifacts/releases/android-apk/app-debug.apk "$out/$asset"
          printf '%s' "$CHANGELOG_B64" | base64 --decode > "$out/notes.md"
          python3 - "$out/$asset" "$out/notes.md" > "$out/version.json" <<'EOF'
          import datetime, hashlib, json, os, sys
          apk, notes = sys.argv[1:]
          repo, tag, name = os.environ["GITHUB_REPOSITORY"], os.environ["RELEASE_TAG"], os.environ["VERSION_NAME"]
          asset = os.path.basename(apk)
          h = hashlib.sha256()
          with open(apk, "rb") as f:
              for block in iter(lambda: f.read(1 << 20), b""):
                  h.update(block)
          print(json.dumps({
              "app": "stdroid",
              "versionCode": int(os.environ["VERSION_CODE"]),
              "versionName": name,
              "apkKey": asset,
              "apkUrl": f"https://github.com/{repo}/releases/download/{tag}/{asset}",
              "size": os.path.getsize(apk),
              "sha256": h.hexdigest(),
              "changelog": open(notes, encoding="utf-8").read().strip(),
              "updatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z"),
          }, ensure_ascii=False, indent=2))
          EOF
          cat "$out/version.json"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Stdroid v$VERSION_NAME" --notes-file "$out/notes.md" --draft
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$out/$asset" "$out/version.json"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
          printf '### Stdroid v%s 已发布\n\n- versionCode: %s\n- https://github.com/%s/releases/tag/%s\n' \
            "$VERSION_NAME" "$VERSION_CODE" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
